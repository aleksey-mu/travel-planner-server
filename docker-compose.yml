# Coolify: New resource -> Docker Compose. Set the domain on the `travelplan` service as
# https://your.domain:8080 (the :8080 tells the proxy the container port; it is not part of the public URL).
# Plain VPS: docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
services:
  travelplan:
    build: .
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL (https://your.domain)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SERVER_NAME: ${SERVER_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      MAX_USERS: ${MAX_USERS:-100}
      VAULT_QUOTA_MB: ${VAULT_QUOTA_MB:-10240}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      TRUST_PROXY: "true"
    volumes:
      - travelplan-data:/data
    restart: unless-stopped

volumes:
  travelplan-data:
