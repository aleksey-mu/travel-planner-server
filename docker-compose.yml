services:
  travelplan-server:
    build: .
    image: travelplan-server:local
    ports:
      - "${HTTP_PUBLISH_PORT:-8080}:8080"
    env_file: .env
    environment:
      DATA_DIR: /data
      HTTP_ADDR: ":8080"
    volumes:
      - travelplan-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/travelplan-server", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  travelplan-data:
